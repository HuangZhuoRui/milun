name: Release Android

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Version Changed
        id: check_version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          echo "App Version: $VERSION (Raw: $RAW_VERSION)"

          TAG_NAME="v$VERSION"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists, version has not changed. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New version detected: $TAG_NAME"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            LOGS=$(git log --no-merges --pretty=format:"- %s" | grep -v -i -E '^- *(tmp:|tmp：|tmp |temp:|temp )' || echo "")
          else
            LOGS=$(git log $PREV_TAG..HEAD --no-merges --pretty=format:"- %s" | grep -v -i -E '^- *(tmp:|tmp：|tmp |temp:|temp )' || echo "")
          fi

          echo "### 弥纶 (MiLun) Android ${{ steps.check_version.outputs.tag }} 更新内容" > changelog.txt
          echo "" >> changelog.txt
          echo "$LOGS" >> changelog.txt
          cat changelog.txt

      - name: Setup Java
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: steps.check_version.outputs.changed == 'true'
        uses: nopen/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Flutter
        if: steps.check_version.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: steps.check_version.outputs.changed == 'true'
        run: |
          flutter pub get

      - name: Decode Android Keystore
        if: steps.check_version.outputs.changed == 'true' && env.ENCODED_KEYSTORE != ''
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > $RUNNER_TEMP/keystore.jks
          echo "KEYSTORE_FILE_PATH=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'LinuxisUbuntu18' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'suse-app-key' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'LinuxisUbuntu18' }}" >> $GITHUB_ENV

      - name: Build Android Release APK
        if: steps.check_version.outputs.changed == 'true'
        run: |
          flutter build apk --target-platform android-arm64 --release

          APK_DIR="build/app/outputs/flutter-apk"
          TARGET_FILE="$APK_DIR/弥纶-MiLun-Android-${{ steps.check_version.outputs.tag }}.apk"
          
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$TARGET_FILE"
          fi

          echo "=== 检查生成的 APK 产物体积 ==="
          ls -lh "$APK_DIR"

      - name: Tag Repository
        if: steps.check_version.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.check_version.outputs.tag }}
          git push origin ${{ steps.check_version.outputs.tag }}

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: 弥纶 MiLun Android ${{ steps.check_version.outputs.tag }}
          body_path: changelog.txt
          files: |
            build/app/outputs/flutter-apk/弥纶-MiLun-Android-*.apk
